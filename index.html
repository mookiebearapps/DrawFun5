<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw Fun</title>
<style>
 :root {
   --bg: #08041a;
   --panel: #12082e;
   --accent: #00ffcc;
   --text: #e8e0ff;
   --muted: #6655aa;
   --radius: 14px;
   box-sizing: border-box;
   padding-top: env(safe-area-inset-top, 0px);
   padding-bottom: env(safe-area-inset-bottom, 0px);
 }
 * { box-sizing: border-box; margin: 0; padding: 0; }
 html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }

 /* MENU */
 #menu {
   display: flex; flex-direction: column; align-items: center;
   justify-content: flex-start;
   width: 100%; height: 100%; overflow-y: auto;
   padding: 24px 20px 40px;
   background: var(--bg);
 }
 #menu h1 {
   font-family: 'Courier New', monospace;
   color: var(--accent); font-size: clamp(22px, 5vw, 32px);
   letter-spacing: 4px; margin-bottom: 6px; text-align: center;
 }
 #menu p.sub {
   color: var(--muted); font-size: 13px; margin-bottom: 24px;
   font-family: sans-serif; text-align: center;
 }
 .section-label {
   width: 100%; max-width: 480px;
   color: var(--muted); font-size: 11px; font-family: sans-serif;
   letter-spacing: 2px; text-transform: uppercase;
   margin: 16px 0 8px; padding-left: 4px;
 }
 .btn {
   width: 100%; max-width: 480px;
   background: var(--panel); border: 1px solid #2a1a55;
   border-radius: var(--radius); padding: 14px 18px;
   color: var(--text); font-size: 18px; font-family: sans-serif;
   cursor: pointer; margin-bottom: 10px;
   display: flex; align-items: center; gap: 12px;
   transition: background 0.15s, border-color 0.15s;
   touch-action: manipulation; user-select: none;
 }
 .btn:active { background: #1e0f44; border-color: var(--accent); }
 .btn .icon { font-size: 22px; width: 28px; text-align: center; }
 .btn .label { flex: 1; }
 .btn .tag {
   font-size: 10px; color: var(--muted);
   background: #1a1040; border-radius: 6px;
   padding: 2px 7px; letter-spacing: 1px;
 }
 .btn.df4 { border-color: #2a0f55; }
 .btn.df4 .tag { color: #aa88ff; background: #1a0833; }

 /* CANVAS SCREEN */
 #canvas-screen {
   display: none; position: fixed; inset: 0;
   flex-direction: column; background: #000;
 }
 #canvas-screen.active { display: flex; }
 #top-bar {
   position: absolute; top: env(safe-area-inset-top, 0px); right: 0;
   z-index: 10; padding: 10px 14px;
 }
 #back-btn {
   background: rgba(0,0,0,0.6); border: 1px solid #444;
   color: #fff; font-size: 14px; border-radius: 20px;
   padding: 6px 14px; cursor: pointer; font-family: sans-serif;
   touch-action: manipulation;
 }
 #main-canvas {
   width: 100%; height: 100%; display: block;
   touch-action: none;
 }
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
 <h1>✦ DRAW FUN ✦</h1>
 <p class="sub">touch · draw · fidget</p>

 <div class="section-label">Draw Fun 3</div>

 <button class="btn" data-mode="buffalo">
   <span class="icon">🦬</span><span class="label">Buffalo Draw</span>
   <span class="tag">DF3</span>
 </button>
 <button class="btn" data-mode="carla">
   <span class="icon">💜</span><span class="label">Carla Draw</span>
   <span class="tag">DF3</span>
 </button>
 <button class="btn" data-mode="mook">
   <span class="icon">🌈</span><span class="label">Mook Draw</span>
   <span class="tag">DF3</span>
 </button>
 <button class="btn" data-mode="mindful">
   <span class="icon">🧘</span><span class="label">Mindful Draw</span>
   <span class="tag">DF3</span>
 </button>
 <button class="btn" data-mode="doodle">
   <span class="icon">🟥</span><span class="label">Doodle Grid</span>
   <span class="tag">DF3</span>
 </button>

 <div class="section-label">Draw Fun 4</div>

 <button class="btn df4" data-mode="zen">
   <span class="icon">☯️</span><span class="label">Zen Draw</span>
   <span class="tag">DF4</span>
 </button>
 <button class="btn df4" data-mode="mirror">
   <span class="icon">🪞</span><span class="label">Mirror Draw</span>
   <span class="tag">DF4</span>
 </button>
 <button class="btn df4" data-mode="splatter">
   <span class="icon">💥</span><span class="label">Splatter Draw</span>
   <span class="tag">DF4</span>
 </button>
 <button class="btn df4" data-mode="echo">
   <span class="icon">👻</span><span class="label">Echo Draw</span>
   <span class="tag">DF4</span>
 </button>
 <button class="btn df4" data-mode="spiral">
   <span class="icon">🌀</span><span class="label">Spiral Draw</span>
   <span class="tag">DF4</span>
 </button>
 <button class="btn df4" data-mode="ink">
   <span class="icon">🖊️</span><span class="label">Ink Draw</span>
   <span class="tag">DF4</span>
 </button>
</div>

<!-- CANVAS SCREEN -->
<div id="canvas-screen">
 <canvas id="main-canvas"></canvas>
 <div id="top-bar">
   <button id="back-btn">← Menu</button>
 </div>
</div>

<script>
// ─── Setup ───────────────────────────────────────────────────────────────────
const menu = document.getElementById('menu');
const screen = document.getElementById('canvas-screen');
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const backBtn = document.getElementById('back-btn');

let currentMode = null;
let animFrame = null;
let modeCleanup = null;

function hsvToRgb(h, s, v) {
 h = ((h % 360) + 360) % 360;
 const i = Math.floor(h / 60) % 6;
 const f = h / 60 - Math.floor(h / 60);
 const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
 const [r, g, b] = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];
 return `rgb(${~~(r*255)},${~~(g*255)},${~~(b*255)})`;
}
function hsvToRgba(h, s, v, a) {
 h = ((h % 360) + 360) % 360;
 const i = Math.floor(h / 60) % 6;
 const f = h / 60 - Math.floor(h / 60);
 const p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
 const [r,g,b] = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i];
 return `rgba(${~~(r*255)},${~~(g*255)},${~~(b*255)},${a})`;
}

function resizeCanvas() {
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
}

function showMenu(fromDeviceBack = false) {
 if (modeCleanup) { modeCleanup(); modeCleanup = null; }
 if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
 screen.classList.remove('active');
 menu.style.display = 'flex';
 
 if (!fromDeviceBack && window.location.hash === '#draw') {
   window.history.back();
 }
}

function startMode(mode) {
 menu.style.display = 'none';
 screen.classList.add('active');
 resizeCanvas();
 currentMode = mode;
 
 window.location.hash = 'draw';

 const fn = modes[mode];
 if (fn) modeCleanup = fn();
}

window.addEventListener('hashchange', () => {
 if (window.location.hash !== '#draw' && screen.classList.contains('active')) {
   showMenu(true);
 }
});

document.querySelectorAll('.btn[data-mode]').forEach(btn => {
 btn.addEventListener('click', () => startMode(btn.dataset.mode));
});

backBtn.addEventListener('click', () => showMenu(false));

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function drawDot(x, y, r, color) {
 ctx.fillStyle = color;
 ctx.beginPath();
 ctx.arc(x, y, r, 0, Math.PI * 2);
 ctx.fill();
}

function showInstructions(lines, color = '#fff') {
 ctx.fillStyle = 'rgba(0,0,0,0.7)';
 ctx.fillRect(0, 0, canvas.width, canvas.height);
 ctx.fillStyle = color;
 ctx.font = `${canvas.width / 22}px sans-serif`;
 ctx.textAlign = 'center';
 const cy = canvas.height / 2;
 const step = canvas.width / 18;
 lines.forEach((line, i) => {
   ctx.fillText(line, canvas.width / 2, cy + (i - (lines.length-1)/2) * step);
 });
}

// ─── MODE: BUFFALO ───────────────────────────────────────────────────────────
function modeBuffalo() {
 // Updated to Buffalo Bills colors: Royal Blue, Red, White
 const colors = ['#00338D', '#C60C30', '#ffffff']; 
 let ci = 0, liftTime = 0, touching = false;
 const R = canvas.width / 45;
 ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Move finger to draw','Two fingers clear'], '#88ccff');

 let instructed = true;
 let px = 0, py = 0, px2 = 0, py2 = 0, npts = 0;

 const handlers = makePointerHandlers(
   (x, y, pc) => {
     if (pc >= 2) { ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); npts=0; return; }
     if (instructed) { instructed=false; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
     if (Date.now() - liftTime > 1000) { ci = (ci+1)%3; }
     touching = true; npts = 0;
     px = x; py = y; px2 = 0; py2 = 0;
     drawDot(x, y, R, colors[ci]);
   },
   (x, y, pc) => {
     if (pc >= 2 || !touching) return;
     if (px2 && npts >= 2) {
       for (let s = 0; s <= 8; s++) {
         const t = s/8;
         const bx = (1-t)*(1-t)*px2 + 2*(1-t)*t*px + t*t*x;
         const by = (1-t)*(1-t)*py2 + 2*(1-t)*t*py + t*t*y;
         drawDot(bx, by, R, colors[ci]);
       }
     }
     px2 = px; py2 = py; px = x; py = y; npts++;
   },
   () => { liftTime = Date.now(); touching = false; npts = 0; }
 );
 return handlers;
}

// ─── MODE: CARLA ─────────────────────────────────────────────────────────────
function modeCarla() {
 let hue = 260, hueDir = 1, touching = false;
 const R = canvas.width / 45;
 ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Move finger to draw','Two fingers clear'], '#dd00ff');
 let instructed = true;
 let px = 0, py = 0, px2 = 0, py2 = 0, npts = 0;

 function advHue() {
   hue += hueDir * 0.25;
   if (hue > 290) { hue = 290; hueDir = -1; }
   if (hue < 260) { hue = 260; hueDir = 1; }
   return hsvToRgb(hue, 1, 0.9);
 }

 const handlers = makePointerHandlers(
   (x, y, pc) => {
     if (pc >= 2) { ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); npts=0; return; }
     if (instructed) { instructed=false; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
     touching=true; npts=0; px=x; py=y; px2=0; py2=0;
     drawDot(x,y,R,advHue());
   },
   (x, y, pc) => {
     if (pc>=2||!touching) return;
     if (px2 && npts>=2) {
       for (let s=0;s<=8;s++) {
         const t=s/8, bx=(1-t)*(1-t)*px2+2*(1-t)*t*px+t*t*x, by=(1-t)*(1-t)*py2+2*(1-t)*t*py+t*t*y;
         drawDot(bx,by,R,advHue());
       }
     }
     px2=px; py2=py; px=x; py=y; npts++;
   },
   () => { touching=false; npts=0; }
 );
 return handlers;
}

// ─── MODE: MOOK ──────────────────────────────────────────────────────────────
function modeMook() {
 let hue = 0, touching = false;
 const R = canvas.width / 35;
 ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Move finger to draw','Two fingers clear'], '#00ff88');
 let instructed = true;
 let px=0,py=0,px2=0,py2=0,npts=0;

 const handlers = makePointerHandlers(
   (x,y,pc) => {
     if (pc>=2) { ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); npts=0; return; }
     if (instructed) { instructed=false; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
     touching=true; npts=0; px=x; py=y; px2=0; py2=0;
     hue=(hue+2.7)%360; drawDot(x,y,R,hsvToRgb(hue,1,1));
   },
   (x,y,pc) => {
     if (pc>=2||!touching) return;
     if (px2&&npts>=2) {
       for (let s=0;s<=8;s++) {
         const t=s/8, bx=(1-t)*(1-t)*px2+2*(1-t)*t*px+t*t*x, by=(1-t)*(1-t)*py2+2*(1-t)*t*py+t*t*y;
         hue=(hue+2.7)%360; drawDot(bx,by,R,hsvToRgb(hue,1,1));
       }
     }
     px2=px; py2=py; px=x; py=y; npts++;
   },
   ()=>{ touching=false; npts=0; }
 );
 return handlers;
}

// ─── MODE: MINDFUL ───────────────────────────────────────────────────────────
function modeMindful() {
 const DRY = 8000;
 const LINE_W = canvas.width / 70; 
 let segments = []; 
 let touching = false;
 let instructed = true;
 let animId;
 let px=0, py=0, px2=0, py2=0, npts=0;

 ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Draw anything','Strokes fade away...','Two fingers clear'], '#000');

 function tick() {
   const now = Date.now();
   ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
   segments = segments.filter(s => now - s.t < DRY);
   
   ctx.lineWidth = LINE_W;
   ctx.lineCap = 'round';
   ctx.lineJoin = 'round';

   for (const s of segments) {
     const age = (now - s.t) / DRY;
     const alpha = Math.max(0, 1 - age);
     ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
     ctx.beginPath();
     
     if (s.isDot) {
       ctx.moveTo(s.x, s.y);
       ctx.lineTo(s.x, s.y);
     } else {
       ctx.moveTo(s.x1, s.y1);
       ctx.quadraticCurveTo(s.cx, s.cy, s.x2, s.y2);
     }
     ctx.stroke();
   }
   animId = requestAnimationFrame(tick);
 }
 animId = requestAnimationFrame(tick);

 const handlers = makePointerHandlers(
   (x,y,pc) => {
     if (pc>=2) { segments=[]; return; }
     if (instructed) { instructed=false; }
     touching=true; npts=0; px=x; py=y; px2=0; py2=0;
     segments.push({ isDot: true, x, y, t: Date.now() });
   },
   (x,y,pc) => {
     if (pc>=2||!touching) return;
     if (px2 && npts >= 2) {
        segments.push({ isDot: false, x1: px2, y1: py2, cx: px, cy: py, x2: x, y2: y, t: Date.now() });
     }
     px2=px; py2=py; px=x; py=y; npts++;
   },
   ()=>{ touching=false; npts=0; }
 );
 return () => { cancelAnimationFrame(animId); handlers(); };
}

// ─── MODE: DOODLE GRID ────────────────────────────────────────────────────────
function modeDoodle() {
 const COLS = 15, ROWS = 20;
 const NC = 9;
 const palette = Array.from({length:NC}, (_,i) => hsvToRgb(360*i/NC, 1, 1));
 palette[NC-1] = '#000000'; // last color = erase (black)
 const cells = new Int8Array(COLS*ROWS).fill(-1);
 let dragColor = 0, lastCell = -1, instructed = true;
 let animId;

 function cellW() { return canvas.width / COLS; }
 function cellH() { return canvas.height / ROWS; }
 function cellAt(x,y) {
   const c = Math.min(COLS-1, Math.max(0, Math.floor(x/cellW())));
   const r = Math.min(ROWS-1, Math.max(0, Math.floor(y/cellH())));
   return r*COLS+c;
 }

 function draw() {
   ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
   for (let i=0;i<COLS*ROWS;i++) {
     if (cells[i]<0) continue;
     const col=i%COLS, row=Math.floor(i/COLS);
     ctx.fillStyle = palette[cells[i]];
     ctx.fillRect(col*cellW(), row*cellH(), cellW(), cellH());
   }
   ctx.strokeStyle='rgba(80,80,80,0.4)'; ctx.lineWidth=1;
   for (let c=0;c<=COLS;c++) { ctx.beginPath(); ctx.moveTo(c*cellW(),0); ctx.lineTo(c*cellW(),canvas.height); ctx.stroke(); }
   for (let r=0;r<=ROWS;r++) { ctx.beginPath(); ctx.moveTo(0,r*cellH()); ctx.lineTo(canvas.width,r*cellH()); ctx.stroke(); }
   if (instructed) {
     ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,canvas.height/2-60,canvas.width,120);
     ctx.fillStyle='#fff'; ctx.font=`${canvas.width/20}px sans-serif`; ctx.textAlign='center';
     ctx.fillText('Tap to paint pixels', canvas.width/2, canvas.height/2-10);
     ctx.fillText('Two fingers for new color', canvas.width/2, canvas.height/2+30);
   }
   animId = requestAnimationFrame(draw);
 }
 animId = requestAnimationFrame(draw);

 const handlers = makePointerHandlers(
   (x,y,pc) => {
     if (pc>=2) { dragColor=(dragColor+1)%NC; return; }
     instructed=false;
     const idx=cellAt(x,y);
     if (cells[idx]>=0) dragColor=(cells[idx]+1)%NC;
     cells[idx]=dragColor; lastCell=idx;
   },
   (x,y,pc)=>{ if(pc>=2) return; const idx=cellAt(x,y); if(idx!==lastCell){cells[idx]=dragColor;lastCell=idx;} },
   ()=>{ lastCell=-1; }
 );
 return ()=>{ cancelAnimationFrame(animId); handlers(); };
}

// ─── MODE: ZEN ────────────────────────────────────────────────────────────────
function modeZen() {
 let hue=0, touching=false, instructed=true;
 const R=canvas.width/40;
 ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['One stroke at a time','Each touch clears','Two fingers back']);
 let px=0,py=0,px2=0,py2=0,npts=0;

 const handlers = makePointerHandlers(
   (x,y,pc) => {
     if (pc>=2) { showMenu(); return; }
     instructed=false; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
     touching=true; npts=0; px=x; py=y; px2=0; py2=0;
     hue=(hue+1)%360; drawDot(x,y,R,hsvToRgb(hue,1,1));
   },
   (x,y,pc) => {
     if(pc>=2||!touching) return;
     if(px2&&npts>=2) {
       for(let s=0;s<=8;s++){
         const t=s/8,bx=(1-t)*(1-t)*px2+2*(1-t)*t*px+t*t*x,by=(1-t)*(1-t)*py2+2*(1-t)*t*py+t*t*y;
         hue=(hue+1)%360; drawDot(bx,by,R,hsvToRgb(hue,1,1));
       }
     }
     px2=px; py2=py; px=x; py=y; npts++;
   },
   ()=>{ touching=false; npts=0; }
 );
 return handlers;
}

// ─── MODE: MIRROR ────────────────────────────────────────────────────────────
function modeMirror() {
 let hue=0, instructed=true;
 const R=canvas.width/50;
 const cx=canvas.width/2, cy=canvas.height/2;
 ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Draw to mirror in 4 directions','Two fingers back'],'#00ffff');
 let px=0,py=0,px2=0,py2=0,npts=0,touching=false;

 function mirrorDot(bx,by,color) {
   const dx=bx-cx, dy=by-cy;
   [[cx+dx,cy+dy],[cx-dx,cy+dy],[cx+dx,cy-dy],[cx-dx,cy-dy]].forEach(([x,y])=>drawDot(x,y,R,color));
 }

 const handlers = makePointerHandlers(
   (x,y,pc) => {
     if(pc>=2){showMenu();return;}
     if(instructed){instructed=false;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);}
     touching=true;npts=0;px=x;py=y;px2=0;py2=0;
   },
   (x,y,pc) => {
     if(pc>=2||!touching)return;
     if(px2&&npts>=2){
       for(let s=0;s<=8;s++){
         const t=s/8,bx=(1-t)*(1-t)*px2+2*(1-t)*t*px+t*t*x,by=(1-t)*(1-t)*py2+2*(1-t)*t*py+t*t*y;
         hue=(hue+2)%360; mirrorDot(bx,by,hsvToRgb(hue,1,1));
       }
     }
     px2=px;py2=py;px=x;py=y;npts++;
   },
   ()=>{touching=false;npts=0;}
 );
 return handlers;
}

// ─── MODE: SPLATTER ──────────────────────────────────────────────────────────
function modeSplatter() {
 let hue=0, instructed=true;
 const DR=canvas.width/80, SR=canvas.width/8;
 ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Touch to splatter!','Drag for trail','Two fingers back'],'#ffff00');

 function splat(x,y) {
   hue=(hue+5)%360;
   for(let i=0;i<18;i++){
     const ang=Math.random()*6.2832, dist=Math.random()*SR;
     const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
     const dr=DR*(0.5+Math.random()*1.5);
     const dh=(hue+Math.random()*30)%360;
     drawDot(x+dx,y+dy,dr,hsvToRgb(dh,1,1));
   }
 }

 const handlers = makePointerHandlers(
   (x,y,pc)=>{ if(pc>=2){showMenu();return;} if(instructed){instructed=false;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);} splat(x,y); },
   (x,y,pc)=>{ if(pc>=2)return; splat(x,y); },
   ()=>{}
 );
 return handlers;
}

// ─── MODE: ECHO ──────────────────────────────────────────────────────────────
function modeEcho() {
 const MAX=300, FADE=2500;
 const ex=new Float32Array(MAX), ey=new Float32Array(MAX);
 const eh=new Float32Array(MAX), et=new Float64Array(MAX);
 const ea=new Uint8Array(MAX);
 let head=0, hue=0, instructed=true, animId;
 const DR=canvas.width/50;
 showInstructions(['Draw a glowing trail','Fades away on its own','Two fingers back'],'#ff00ff');

 function tick() {
   const now=Date.now();
   ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
   for(let i=0;i<MAX;i++){
     if(!ea[i])continue;
     const frac=(now-et[i])/FADE;
     if(frac>=1){ea[i]=0;continue;}
     ctx.fillStyle=hsvToRgba(eh[i],1,1,1-frac);
     ctx.beginPath();ctx.arc(ex[i],ey[i],DR,0,Math.PI*2);ctx.fill();
   }
   animId=requestAnimationFrame(tick);
 }
 animId=requestAnimationFrame(tick);

 function addPt(x,y){
   hue=(hue+2)%360;
   const idx=head%MAX;
   ex[idx]=x;ey[idx]=y;eh[idx]=hue;et[idx]=Date.now();ea[idx]=1;
   head++;
 }

 const handlers = makePointerHandlers(
   (x,y,pc)=>{ if(pc>=2){ea.fill(0);showMenu();return;} if(instructed){instructed=false;} addPt(x,y); },
   (x,y,pc)=>{ if(pc>=2)return; addPt(x,y); },
   ()=>{}
 );
 return ()=>{ cancelAnimationFrame(animId); handlers(); };
}

// ─── MODE: SPIRAL ────────────────────────────────────────────────────────────
function modeSpiral() {
 let hue=0, ang=0, orbitR=0, lastX=null, lastY=null, instructed=true;
 const DR=canvas.width/120, NUM=2;
 ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
 showInstructions(['Draw spiraling orbits','Expands as you move','Two fingers back'],'#aa66ff');

 function drawSpiral(x,y){
   if(lastX!==null){
     const dx=x-lastX,dy=y-lastY;
     if(Math.sqrt(dx*dx+dy*dy)<DR/2)return;
   } else { orbitR=0; }
   hue=(hue+1.5)%360;
   for(let i=0;i<NUM;i++){
     const a=ang+i*(6.2832/NUM);
     drawDot(x+Math.cos(a)*orbitR,y+Math.sin(a)*orbitR,DR,hsvToRgb(hue,1,1));
   }
   ang+=0.35; orbitR+=canvas.width/800;
   if(orbitR>canvas.width/3)orbitR=0;
   lastX=x;lastY=y;
 }

 const handlers = makePointerHandlers(
   (x,y,pc)=>{ if(pc>=2){showMenu();return;} if(instructed){instructed=false;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);} lastX=null;orbitR=0;drawSpiral(x,y); },
   (x,y,pc)=>{ if(pc>=2)return; drawSpiral(x,y); },
   ()=>{lastX=null;}
 );
 return handlers;
}

// ─── MODE: INK ───────────────────────────────────────────────────────────────
function modeInk() {
 let ink=1, touching=false, instructed=true;
 const MAX_R=canvas.width/25;
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(0,canvas.height/3-50,canvas.width,160);
 ctx.fillStyle='#222'; ctx.font=`${canvas.width/22}px sans-serif`; ctx.textAlign='center';
 ctx.fillText('Draw to use your ink', canvas.width/2, canvas.height/2-20);
 ctx.fillText('Lift finger to dip pen', canvas.width/2, canvas.height/2+20);
 ctx.fillText('Two fingers back', canvas.width/2, canvas.height/2+60);

 let px=0,py=0,px2=0,py2=0,npts=0;

 function drawInk(x,y){
   if(npts<2){px2=px;py2=py;px=x;py=y;npts++;return;}
   const sdx=x-px2,sdy=y-py2,dist=Math.sqrt(sdx*sdx+sdy*sdy);
   for(let s=0;s<=8;s++){
     const t=s/8;
     const bx=(1-t)*(1-t)*px2+2*(1-t)*t*px+t*t*x;
     const by=(1-t)*(1-t)*py2+2*(1-t)*t*py+t*t*y;
     const r=MAX_R*ink;
     const c=Math.floor(255*(1-ink));
     ctx.fillStyle=`rgb(${c},${c},${c})`;
     ctx.beginPath();ctx.arc(bx,by,Math.max(r,1),0,Math.PI*2);ctx.fill();
     ink=Math.max(0, ink - (dist/8)/(canvas.width*5));
   }
   px2=px;py2=py;px=x;py=y;
 }

 const handlers = makePointerHandlers(
   (x,y,pc)=>{
     if(pc>=2){showMenu();return;}
     if(instructed){instructed=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
     touching=true;ink=1;npts=0;px=x;py=y;px2=0;py2=0;
   },
   (x,y,pc)=>{if(pc>=2||!touching)return;drawInk(x,y);},
   ()=>{touching=false;npts=0;}
 );
 return handlers;
}

// ─── Pointer helper ───────────────────────────────────────────────────────────
let activePointers = new Map();

function makePointerHandlers(onDown, onMove, onUp) {
 activePointers.clear();

 function pd(e) {
   e.preventDefault();
   activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
   const pc = activePointers.size;
   if (pc === 1) onDown(e.clientX, e.clientY, 1);
   else onDown(e.clientX, e.clientY, pc);
 }
 function pm(e) {
   e.preventDefault();
   activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
   onMove(e.clientX, e.clientY, activePointers.size);
 }
 function pu(e) {
   e.preventDefault();
   activePointers.delete(e.pointerId);
   if (activePointers.size === 0) onUp();
 }

 canvas.addEventListener('pointerdown', pd, {passive: false});
 canvas.addEventListener('pointermove', pm, {passive: false});
 canvas.addEventListener('pointerup', pu, {passive: false});
 canvas.addEventListener('pointercancel', pu, {passive: false});

 return () => {
   canvas.removeEventListener('pointerdown', pd);
   canvas.removeEventListener('pointermove', pm);
   canvas.removeEventListener('pointerup', pu);
   canvas.removeEventListener('pointercancel', pu);
   activePointers.clear();
 };
}

const modes = {
 buffalo: modeBuffalo,
 carla: modeCarla,
 mook: modeMook,
 mindful: modeMindful,
 doodle: modeDoodle,
 zen: modeZen,
 mirror: modeMirror,
 splatter: modeSplatter,
 echo: modeEcho,
 spiral: modeSpiral,
 ink: modeInk,
};

window.addEventListener('resize', () => {
 if (currentMode) { resizeCanvas(); }
});
